name: Build Android APK Offline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Configure Android Project
        run: |
          python3 -m pip install pillow
          cp pubspec.yaml pubspec.yaml.bak
          rm -rf android
          flutter create --project-name=evoting_karangmukti --platforms=android --org com.evoting .
          cp pubspec.yaml.bak pubspec.yaml
          python3 setup_android.py

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EvotingPilkades-Tati-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
