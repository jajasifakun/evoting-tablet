name: Build Android APK Offline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Recreate Clean Android Harness
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          rm -rf android
          flutter create --project-name=evoting_karangmukti --platforms=android --org com.evoting .
          cp pubspec.yaml.bak pubspec.yaml

          python3 -c '
          import os, shutil, re

          # 1. Update AndroidManifest.xml dengan Izin Kamera, Bluetooth, dan Nama Aplikasi
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              content = f.read()

          perms = """    <uses-permission android:name="android.permission.CAMERA" />
    <uses-feature android:name="android.hardware.camera" android:required="false" />
    <uses-permission android:name="android.permission.BLUETOOTH" />
    <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
    <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="30" />
"""
          if "android.permission.CAMERA" not in content:
              content = content.replace("<application", perms + "    <application")

          content = re.sub(r"android:label=\"[^\"]*\"", "android:label=\"E-Voting Karang Mukti\"", content)
          if "android:roundIcon" not in content:
              content = content.replace("android:icon=\"@mipmap/ic_launcher\"", "android:icon=\"@mipmap/ic_launcher\" android:roundIcon=\"@mipmap/ic_launcher\"")

          with open(path, "w") as f:
              f.write(content)

          # 2. Update Launcher Icon Desktop Android dengan Logo Resmi Pilkades
          logo_src = "assets/images/pilkades-logo.png"
          try:
              from PIL import Image
              img = Image.open(logo_src).convert("RGBA")
              sizes = {
                  "mipmap-mdpi": (48, 48),
                  "mipmap-hdpi": (72, 72),
                  "mipmap-xhdpi": (96, 96),
                  "mipmap-xxhdpi": (144, 144),
                  "mipmap-xxxhdpi": (192, 192),
              }
              for folder, sz in sizes.items():
                  d = os.path.join("android/app/src/main/res", folder)
                  os.makedirs(d, exist_ok=True)
                  resized = img.resize(sz, Image.LANCZOS if hasattr(Image, "LANCZOS") else Image.Resampling.LANCZOS)
                  resized.save(os.path.join(d, "ic_launcher.png"), "PNG")

              # Adaptive foreground
              fg_dir = "android/app/src/main/res/drawable"
              os.makedirs(fg_dir, exist_ok=True)
              fg = Image.new("RGBA", (512, 512), (255, 255, 255, 0))
              fit = img.resize((360, 360), Image.LANCZOS if hasattr(Image, "LANCZOS") else Image.Resampling.LANCZOS)
              fg.paste(fit, (76, 76), fit)
              fg.save(os.path.join(fg_dir, "ic_launcher_foreground.png"), "PNG")
          except Exception as e:
              print("PIL fallback:", e)
              for root, dirs, files in os.walk("android/app/src/main/res"):
                  for fn in files:
                      if "ic_launcher" in fn and fn.endswith(".png"):
                          shutil.copy(logo_src, os.path.join(root, fn))

          val_dir = "android/app/src/main/res/values"
          os.makedirs(val_dir, exist_ok=True)
          with open(os.path.join(val_dir, "colors.xml"), "w") as f:
              f.write("""<?xml version="1.0" encoding="utf-8"?>
<resources>
    <color name="ic_launcher_background">#FFFFFF</color>
</resources>""")

          # 3. Update MainActivity.kt dengan Native Bluetooth ESC/POS Channel
          kt_code = """package com.evoting.evoting_karangmukti

import io.flutter.embedding.android.FlutterActivity
import io.flutter.embedding.engine.FlutterEngine
import io.flutter.plugin.common.MethodChannel
import android.bluetooth.BluetoothAdapter
import android.bluetooth.BluetoothDevice
import android.bluetooth.BluetoothSocket
import java.io.OutputStream
import java.util.UUID

class MainActivity: FlutterActivity() {
    private val CHANNEL = "com.evoting/thermal_printer"
    private var bluetoothSocket: BluetoothSocket? = null
    private var outputStream: OutputStream? = null

    override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
        super.configureFlutterEngine(flutterEngine)
        MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
            when (call.method) {
                "getPairedDevices" -> {
                    try {
                        val adapter = BluetoothAdapter.getDefaultAdapter()
                        if (adapter == null || !adapter.isEnabled) {
                            result.success(emptyList<Map<String, String>>())
                            return@setMethodCallHandler
                        }
                        val devices = adapter.bondedDevices.map { device ->
                            mapOf("name" to (device.name ?: "Unknown"), "address" to device.address)
                        }
                        result.success(devices)
                    } catch (e: Exception) {
                        result.success(emptyList<Map<String, String>>())
                    }
                }
                "connect" -> {
                    val address = call.argument<String>("address")
                    val adapter = BluetoothAdapter.getDefaultAdapter()
                    val device = adapter?.getRemoteDevice(address)
                    if (device != null) {
                        Thread {
                            try {
                                outputStream?.close()
                                bluetoothSocket?.close()
                                val sppUuid = UUID.fromString("00001101-0000-1000-8000-00805F9B34FB")
                                bluetoothSocket = device.createRfcommSocketToServiceRecord(sppUuid)
                                bluetoothSocket?.connect()
                                outputStream = bluetoothSocket?.outputStream
                                runOnUiThread { result.success(true) }
                            } catch (e: Exception) {
                                outputStream = null
                                bluetoothSocket = null
                                runOnUiThread { result.success(false) }
                            }
                        }.start()
                    } else {
                        result.success(false)
                    }
                }
                "printRaw" -> {
                    val bytes = call.argument<ByteArray>("bytes")
                    if (outputStream != null && bytes != null) {
                        Thread {
                            try {
                                outputStream?.write(bytes)
                                outputStream?.flush()
                                runOnUiThread { result.success(true) }
                            } catch (e: Exception) {
                                runOnUiThread { result.success(false) }
                            }
                        }.start()
                    } else {
                        result.success(false)
                    }
                }
                "disconnect" -> {
                    try {
                        outputStream?.close()
                        bluetoothSocket?.close()
                    } catch (e: Exception) {}
                    outputStream = null
                    bluetoothSocket = null
                    result.success(true)
                }
                "isConnected" -> {
                    result.success(bluetoothSocket?.isConnected ?: false)
                }
                else -> result.notImplemented()
            }
        }
    }
}
"""
          for root, dirs, files in os.walk("android"):
              if "MainActivity.kt" in files:
                  with open(os.path.join(root, "MainActivity.kt"), "w") as f:
                      f.write(kt_code)
          '

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EvotingPilkades-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
