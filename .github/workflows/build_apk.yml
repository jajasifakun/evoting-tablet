name: Build Android APK Offline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Recreate Clean Android Harness
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          rm -rf android
          flutter create --project-name=evoting_karangmukti --platforms=android --org com.evoting .
          cp pubspec.yaml.bak pubspec.yaml
          python3 -c '
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path, "r") as f:
              content = f.read()
          permission = "    <uses-permission android:name=\"android.permission.CAMERA\" />\n    <uses-feature android:name=\"android.hardware.camera\" android:required=\"false\" />\n"
          if "android.permission.CAMERA" not in content:
              content = content.replace("<application", permission + "    <application")
          with open(path, "w") as f:
              f.write(content)
          '

      - name: Get Dependencies
        run: flutter pub get

      - name: Build APK Release
        run: flutter build apk --release

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: EvotingPilkades-Release-APK
          path: build/app/outputs/flutter-apk/app-release.apk
